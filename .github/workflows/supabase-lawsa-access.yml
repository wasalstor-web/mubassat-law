name: Supabase LAWSA Access

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation to run against LAWSA"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - dry-run
          - deploy

permissions:
  contents: read

concurrency:
  group: supabase-lawsa-production
  cancel-in-progress: false

jobs:
  supabase:
    name: ${{ inputs.mode }} LAWSA
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_PROJECT_ID: bzkjxxptdfpqmuwoxtjp
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate encrypted credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }

      - name: Link repository to LAWSA
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify project access and migration history
        run: supabase migration list

      - name: Preview pending migrations
        if: ${{ inputs.mode == 'dry-run' || inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          if find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit 2>/dev/null | grep -q .; then
            supabase db push --dry-run
          else
            echo "No committed migrations found. Verification completed without schema changes."
          fi

      - name: Deploy pending migrations
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          if find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print -quit 2>/dev/null | grep -q .; then
            supabase db push
          else
            echo "No committed migrations to deploy."
          fi
